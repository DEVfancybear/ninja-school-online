name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Cài phụ thuộc
        run: pnpm install --frozen-lockfile

      - name: Kiểm tra dữ liệu game
        run: pnpm validate:data

      - name: Lint
        run: pnpm lint

      - name: Kiểm tra kiểu
        run: pnpm typecheck

      - name: Kiểm thử
        run: pnpm test

      - name: Build
        run: pnpm build
