name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    # PostgreSQL thật cho các test tích hợp của server (tài khoản, nhân vật).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ninja
          POSTGRES_PASSWORD: ninja_dev_password
          POSTGRES_DB: ninja_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ninja -d ninja_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://ninja:ninja_dev_password@127.0.0.1:5432/ninja_test

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v7

      - name: Cài pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.11.2

      - name: Cài Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Cài phụ thuộc
        run: pnpm install --frozen-lockfile

      - name: Kiểm tra dữ liệu game
        run: pnpm validate:data

      - name: Lint
        run: pnpm lint

      - name: Kiểm tra kiểu
        run: pnpm typecheck

      - name: Kiểm thử
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: Kiểm thử đầu-cuối trên trình duyệt
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ninja
          POSTGRES_PASSWORD: ninja_dev_password
          POSTGRES_DB: ninja
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ninja -d ninja"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v7

      - name: Cài pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.11.2

      - name: Cài Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Cài phụ thuộc
        run: pnpm install --frozen-lockfile

      - name: Tạo file .env cho server
        run: |
          {
            echo "NODE_ENV=development"
            echo "HOST=127.0.0.1"
            echo "PORT=3000"
            echo "LOG_LEVEL=info"
            echo "DATABASE_URL=postgresql://ninja:ninja_dev_password@127.0.0.1:5432/ninja"
            echo "JWT_SECRET=ci-only-secret-not-for-production"
          } > .env

      - name: Chạy migration
        run: pnpm db:migrate

      - name: Cài trình duyệt cho Playwright
        run: pnpm --filter @ninja/e2e exec playwright install --with-deps chromium

      - name: Kiểm thử đầu-cuối
        run: pnpm e2e

      - name: Lưu báo cáo khi thất bại
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 7
