# Môi trường phát triển cục bộ: PostgreSQL + Redis (+ Adminer để xem dữ liệu).
# Dùng: docker compose -f infra/docker/docker-compose.dev.yml up -d
# Biến môi trường đọc từ file .env ở gốc repo (xem .env.example).
name: ninja-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ninja}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ninja_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ninja}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ninja} -d ${POSTGRES_DB:-ninja}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${ADMINER_PORT:-8080}:8080'

volumes:
  postgres-data:
  redis-data:
