packages:
  - 'client'
  - 'server'
  - 'shared'
  - 'tools/*'

# pnpm 12 đọc cấu hình từ đây (không còn đọc trường "pnpm" trong package.json).
# Cho phép các gói dưới đây chạy script cài đặt (build binary gốc).
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  '@node-rs/argon2': true

minimumReleaseAgeExclude:
  - '@playwright/test@1.64.1'
  - playwright-core@1.64.1
  - playwright@1.64.1
